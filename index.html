<style>
/* Layout: one focused left-aligned column in Visioniary colors: cream ground, dark brown ink, warm gold highlights */
:root{
  --bg:#F5F0E8; --surface:#FBF8F3; --fg:#2C2417; --muted:#6B5F4C; --line:#E2D7C5;
  --accent:#2C2417; --accent-soft:#ECE2D1; --gold:#C4A882; --eyebrow:#8A6D45;
  --mark:#C4A882; --mark-soft:#EFE6D6; --on-accent:#F5F0E8; --err:#9A3B23;
  --f-display:"Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1810; --surface:#2C2417; --fg:#F5F0E8; --muted:#B8AA92; --line:#43382A;
  --accent:#C4A882; --accent-soft:#3A3022; --gold:#C4A882; --eyebrow:#C4A882;
  --mark:#D6BC93; --mark-soft:#3A3022; --on-accent:#2C2417; --err:#E48A6E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1D1810; --surface:#2C2417; --fg:#F5F0E8; --muted:#B8AA92; --line:#43382A;
  --accent:#C4A882; --accent-soft:#3A3022; --gold:#C4A882; --eyebrow:#C4A882;
  --mark:#D6BC93; --mark-soft:#3A3022; --on-accent:#2C2417; --err:#E48A6E; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:28px 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.02;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.6rem,8vw,4rem);font-weight:400}
h2{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:400}
h3{font-size:1.5rem;font-weight:400}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:18px}

/* intro */
.intro-lede{font-size:1.08rem;max-width:60ch;color:var(--muted)}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dim{border-top:3px solid var(--gold);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.dim b{font-family:var(--f-display);font-weight:400;font-size:1.3rem;letter-spacing:.03em}
.dim span{font-size:.88rem;color:var(--muted)}
.codes{display:flex;flex-wrap:wrap;gap:8px}
.code{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.code b{color:var(--fg)}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
input[type=text]{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:360px}
input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

a.btn{text-decoration:none;display:inline-block}
.btn{font:600 1rem var(--f-body);border-radius:999px;padding:12px 22px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--on-accent);transition:transform .12s ease, opacity .12s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.fine{font-size:.82rem;color:var(--muted);max-width:62ch}

/* progress */
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.seg{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.seg .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
.seg span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.on span{color:var(--fg)}

/* question */
.qhead{display:flex;flex-direction:column;gap:8px}
.qnum{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover{border-color:var(--accent)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.opt.multi .dot{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--on-accent)}
.opt.multi[aria-pressed="true"] .dot::after{border-radius:2px}

/* results */
.hero-res{display:flex;flex-direction:column;gap:12px}
.hcode{display:flex;gap:8px;flex-wrap:wrap}
.hcode .l{font-family:var(--f-display);font-weight:400;font-size:2.8rem;line-height:1;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--fg);padding-top:4px}
.hcode .l:first-child{background:var(--accent);color:var(--on-accent)}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:minmax(110px,170px) 1fr 40px;gap:12px;align-items:center}
.brow .nm{font-weight:600;font-size:.92rem;min-width:0}
.brow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.track{height:12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--muted);opacity:.55;border-radius:99px}
.brow.top .track i{background:var(--gold);opacity:1}
.brow .pct{font-family:var(--f-mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.traits{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.trait{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.trait small{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trait b{font-size:.95rem}

.match{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.match.best{border-color:var(--gold);border-width:2px}
.mtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mtop > div{min-width:0}
.score{flex:none;font-family:var(--f-mono);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;background:var(--accent-soft);color:var(--fg)}
.mcode{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.why{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:.92rem}
.why li{display:flex;gap:8px}
.why li::before{content:"+";font-family:var(--f-mono);font-weight:700;color:var(--eyebrow)}
.why li.warn::before{content:"!";color:var(--muted)}
.step{font-size:.9rem;background:var(--mark-soft);border-radius:10px;padding:10px 12px}
.step b{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.more div{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.9rem;background:var(--bg)}
.more span{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;font:.82rem/1.5 var(--f-mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px}
.email{font-family:var(--f-mono);font-weight:700;font-size:.95rem;user-select:all;word-break:break-all;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--fg)}
.fields{display:flex;flex-direction:column;gap:12px}
input[type=email]{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:360px}
input[type=email]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--err);font-weight:600;font-size:.9rem;min-height:0}
.err:empty{display:none}
.sendnote{font-size:.92rem;font-weight:600;padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--fg);border:1px solid var(--line)}
.sendnote.ok{border-color:var(--gold)}
.toast{font-size:.88rem;color:var(--eyebrow);font-weight:600}
@media (max-width:480px){.brow{grid-template-columns:1fr 40px}.brow .track{grid-column:1 / -1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>
const LETTERS = {

const SECTIONS = ["Where you are","Interests","Strengths","Work style","Priorities"];
const PAINS = {earn:"I've hit a pay ceiling",growth:"There's no clear next step up",flex:"I'm burned out or have no flexibility",impact:"The work doesn't feel meaningful",creative:"I'm bored and not using my creativity",stable:"I'm worried about job security"};
const CHANGE = ["A new role in my current industry","My same skills in a new industry","A completely new direction","My own business or consulting"];

const Q = [
 {s:0,t:"What's making you feel stuck right now?",multi:2,o:Object.entries(PAINS).map(([k,t])=>[t,{},{},null,k])},
 {s:0,t:"What kind of change are you open to?",o:CHANGE.map((t,i)=>[t,i===3?{E:1}:{},{change:i}])},

 {s:1,t:"On a free Saturday, which sounds most fun?",o:[

 {s:1,t:"Which part of your current or past jobs have you enjoyed most?",o:[
  ["Hands-on work with tools, equipment, or systems",{R:3}],["Digging into data or figuring out why something happened",{I:3}],["Creating presentations, content, or designs",{A:3}],
  ["Training, mentoring, or supporting people",{S:3}],["Winning deals, pitching ideas, or leading initiatives",{E:3}],["Building processes and keeping things accurate",{C:3}]]},
 {s:1,t:"Which work problem would you most like to solve?",o:[
  ["A system keeps breaking down",{R:3}],["The numbers don't add up and nobody knows why",{I:3}],["The brand or message feels dated",{A:3}],
  ["A teammate is struggling and needs support",{S:3}],["The company keeps losing deals",{E:3}],["Every process is a mess and nobody follows it",{C:3}]]},
 {s:1,t:"Which compliment would mean the most to you?",o:[
  ["“You can fix anything.”",{R:2}],["“You figured that out so fast.”",{I:2}],["“That’s so original.”",{A:2}],
  ["“You really understand people.”",{S:2}],["“You’re a natural leader.”",{E:2}],["“I can always count on you.”",{C:2}]]},

 {s:2,t:"What do coworkers usually come to you for?",o:[
  ["Fixing tech or troubleshooting tools",{R:2,I:1}],["Researching or explaining something complicated",{I:3}],["Writing, design, or creative ideas",{A:3}],
  ["Advice, coaching, or someone to listen",{S:3}],["Negotiating, persuading, or making connections",{E:3}],["Planning, scheduling, or tracking the details",{C:3}]]},
 {s:2,t:"On a big project, what role do you naturally take?",o:[
  ["The one who builds or configures it",{R:2,I:1}],["The one who finds the data and facts",{I:2,C:1}],["The one who makes it look and sound great",{A:3}],
  ["The one who keeps everyone working well together",{S:3}],["The one who pitches and presents it",{E:3}],["The one who owns the timeline and checklist",{C:3}]]},
 {s:2,t:"How do you feel about working with numbers and technology?",o:[
  ["I love it. Spreadsheets and software are fun.",{I:1,C:1},{num:3}],["I'm comfortable and pick up new tools quickly.",{},{num:2}],
  ["Fine when I need to, but it isn't my favorite.",{},{num:1}],["I'd rather avoid it as much as possible.",{A:1,S:1},{num:0}]]},

 {s:3,t:"How much people contact do you want in a typical day?",o:[
  ["A lot. I get energy from talking with people all day.",{S:1,E:1},{social:2}],["A balance of people time and focus time.",{},{social:1}],["Mostly independent, heads-down work.",{I:1},{social:0}]]},
 {s:3,t:"Which kind of day suits you best?",o:[
  ["A clear routine where I know what to expect",{C:1},{structure:2}],["Some structure with room to mix things up",{},{structure:1}],["Every day is different and I adapt as I go",{E:1,A:1},{structure:0}]]},
 {s:3,t:"Where do you do your best work on a team?",o:[
  ["Leading: setting direction and making the call",{E:1},{lead:2}],["Collaborating as a key contributor",{},{lead:1}],["As the go-to expert in my specialty",{I:1},{lead:0}]]},
 {s:3,t:"What pace do you prefer?",o:[
  ["Fast, with deadlines and some adrenaline",{},{pace:2}],["Steady and sustainable",{},{pace:0}],["Either works for me",{},{pace:-1}]]},

 {s:4,t:"Pick your top two priorities for your next move.",multi:2,o:[
  ["High earning potential",{},{},"earn"],["Stability and security",{},{},"stable"],["Flexibility or remote work",{},{},"flex"],

 {s:4,t:"How much new training are you open to?",o:[
  ["Short: a certificate or a few months",{},{edu:0}],["Medium: one to two years of training",{},{edu:1}],["Long: a degree or license if it's the right fit",{},{edu:2}]]},

// a: social 0-2, structure 0-2, lead 0-2, pace 0-2, num 0-3, edu 0-2, risk 0-2; t = how directly typical mid-career skills transfer (0-2)
const CAREERS = [
 {n:"Customer Success Manager",c:"ESC",t:2,a:{social:2,structure:1,lead:1,pace:1,num:2,edu:0,risk:0},v:["growth","flex","stable"],titles:["Customer Success Manager","Client Services Lead","Account Manager"],d:"Makes sure clients get real value from a product so they stay and grow with the company.",step:"Rewrite your resume around client outcomes: retention, renewals, and problems you solved."},
 {n:"Project / Program Manager",c:"ECS",t:2,a:{social:1,structure:2,lead:2,pace:2,num:2,edu:0,risk:0},v:["growth","earn","stable"],titles:["Project Manager","Program Manager","PMO Lead"],d:"Keeps cross-functional work on time and on budget, from kickoff to delivery.",step:"List three projects you've already run, then look at the CAPM or PMP based on your hours."},
 {n:"Business Operations / Chief of Staff",c:"ECI",t:2,a:{social:1,structure:1,lead:2,pace:2,num:2,edu:0,risk:0},v:["growth","earn","impact"],titles:["Business Operations Manager","Chief of Staff","Strategy & Operations Lead"],d:"Works beside leadership to fix how the business runs and turn strategy into action.",step:"Write up one process you improved, with the before-and-after numbers."},
 {n:"Product Manager",c:"EIA",t:1,a:{social:1,structure:0,lead:2,pace:2,num:2,edu:0,risk:1},v:["earn","growth","creative"],titles:["Product Manager","Product Owner","Associate PM"],d:"Decides what a product should do next by balancing customer needs, data, and business goals.",step:"Volunteer for a product feedback or pilot group at your current company."},
 {n:"UX Researcher / Designer",c:"AIS",t:1,a:{social:1,structure:0,lead:1,pace:1,num:1,edu:1,risk:1},v:["creative","flex","growth"],titles:["UX Researcher","UX Designer","Service Designer"],d:"Studies how people use products and designs experiences that are easier to use.",step:"Take a short UX course and redesign one frustrating tool you use at work."},
 {n:"Data / Business Analyst",c:"ICE",t:1,a:{social:0,structure:1,lead:0,pace:1,num:3,edu:0,risk:0},v:["flex","stable","growth"],titles:["Business Analyst","Data Analyst","Reporting Analyst"],d:"Turns data into reports and recommendations that help leaders decide.",step:"Learn pivot tables and basic SQL, then analyze a dataset from your own field."},
 {n:"HR Business Partner / People Ops",c:"SEC",t:2,a:{social:2,structure:2,lead:1,pace:1,num:1,edu:0,risk:0},v:["impact","stable","growth"],titles:["HR Business Partner","People Operations Manager","Employee Relations Specialist"],d:"Advises managers on people issues, policies, and how to build healthy teams.",step:"Look into the SHRM-CP and talk with an HR partner about their week."},
 {n:"Learning & Development",c:"SAE",t:2,a:{social:2,structure:1,lead:1,pace:1,num:1,edu:0,risk:0},v:["impact","creative","growth"],titles:["Corporate Trainer","Instructional Designer","Enablement Manager"],d:"Builds and delivers training that helps employees grow and do their jobs well.",step:"Turn something you already teach at work into a short training module."},
 {n:"Career / Executive Coach",c:"SEA",t:1,a:{social:2,structure:0,lead:1,pace:0,num:0,edu:1,risk:2},v:["impact","flex","creative"],titles:["Career Coach","Leadership Coach","Executive Coach"],d:"Helps professionals get clear on goals and make changes in their careers.",step:"Coach three people for free and collect feedback before choosing a certification."},
 {n:"Account Executive / Business Development",c:"ESC",t:2,a:{social:2,structure:0,lead:2,pace:2,num:1,edu:0,risk:1},v:["earn","growth","flex"],titles:["Account Executive","Business Development Manager","Partnerships Lead"],d:"Finds new customers and partners and closes deals, often with commission upside.",step:"Ask two salespeople in your industry what their quota and average week look like."},
 {n:"Marketing / Content Strategist",c:"AES",t:1,a:{social:1,structure:0,lead:1,pace:2,num:1,edu:0,risk:1},v:["creative","flex","growth"],titles:["Content Strategist","Marketing Manager","Brand Manager"],d:"Plans campaigns and content that grow an audience and drive sales.",step:"Build one campaign plan for a real or sample brand and track what it would measure."},
 {n:"Technical Writer / Content Designer",c:"AIC",t:1,a:{social:0,structure:1,lead:0,pace:0,num:1,edu:0,risk:0},v:["flex","creative","stable"],titles:["Technical Writer","Content Designer","Documentation Specialist"],d:"Explains complex products and processes in clear, usable writing.",step:"Rewrite one confusing work document and use it as a writing sample."},
 {n:"Implementation / Solutions Consultant",c:"EIS",t:2,a:{social:2,structure:1,lead:1,pace:2,num:2,edu:0,risk:0},v:["earn","growth","flex"],titles:["Implementation Manager","Solutions Consultant","Onboarding Specialist"],d:"Gets new clients set up on a product and tailors it to how they work.",step:"Map your experience rolling out tools or processes into a short case study."},
 {n:"Nonprofit Program Manager",c:"SEC",t:2,a:{social:2,structure:1,lead:2,pace:1,num:1,edu:0,risk:0},v:["impact","growth","stable"],titles:["Program Manager","Program Director","Community Programs Lead"],d:"Runs programs that serve a community, from budgets and staff to outcomes.",step:"Join a nonprofit board or committee near you to test the fit."},
 {n:"Healthcare Operations",c:"CES",t:2,a:{social:1,structure:2,lead:2,pace:1,num:2,edu:0,risk:0},v:["stable","impact","growth"],titles:["Practice Manager","Clinical Operations Manager","Revenue Cycle Manager"],d:"Runs the business side of healthcare: staffing, billing, scheduling, and patient flow.",step:"Look at practice management roles and certifications like the CMPE."},
 {n:"Cybersecurity / IT",c:"RIC",t:0,a:{social:1,structure:1,lead:0,pace:1,num:3,edu:1,risk:0},v:["stable","growth","earn"],titles:["Security Analyst","IT Support Specialist","GRC Analyst"],d:"Protects systems and data and keeps technology running.",step:"Start the CompTIA Security+ or Google Cybersecurity certificate."},
 {n:"Salesforce / Systems Administrator",c:"CIR",t:1,a:{social:1,structure:2,lead:0,pace:1,num:3,edu:0,risk:0},v:["stable","flex","earn"],titles:["Salesforce Administrator","CRM Administrator","Systems Analyst"],d:"Configures and maintains the business software teams use every day.",step:"Complete a few free Trailhead modules to see if you enjoy the work."},
 {n:"Compliance / Risk Analyst",c:"CIE",t:1,a:{social:0,structure:2,lead:0,pace:0,num:2,edu:1,risk:0},v:["stable","earn","growth"],titles:["Compliance Analyst","Risk Analyst","Quality Assurance Specialist"],d:"Makes sure a company follows laws, regulations, and its own standards.",step:"Identify the regulations in your current industry and look at matching certifications."},

const TRAIT_TXT = {
 social:["Prefers independent work","Balances people and focus time","Energized by people"],
 structure:["Thrives on variety","Likes some structure","Thrives on routine"],
 lead:["Specialist / go-to expert","Collaborator","Leader"],
 pace:{"-1":"Flexible on pace","0":"Steady pace","2":"Fast pace"},
 num:["Avoids numbers and tech","Okay with numbers and tech","Comfortable with numbers and tech","Loves numbers and tech"],
 edu:["Wants short training","Open to 1–2 years","Open to a degree"],
 risk:["Wants a steady paycheck","Open to some risk","Wants to build their own thing"]
};

const FORMSPREE="https://formspree.io/f/mnpjqred";
let state = {step:-1, name:"", email:"", ans:{}};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function profile(){
  const r={R:0,I:0,A:0,S:0,E:0,C:0}, at={}, vals=[], pains=[];
  Q.forEach((q,i)=>{
    const a=state.ans[i]; if(a==null) return;
    (Array.isArray(a)?a:[a]).forEach(k=>{
      const o=q.o[k];
      for(const L in o[1]) r[L]+=o[1][L];
      if(o[2]) Object.assign(at,o[2]);
      if(o[3]) vals.push(o[3]);
      if(o[4]) pains.push(o[4]);
    });
  });
  return {r,at,vals,pains};
}

function score(p){
  const max=Math.max(1,...Object.values(p.r));
  const u={}; for(const L in p.r) u[L]=p.r[L]/max;
  return CAREERS.map(c=>{
    const L=c.c.split("");
    const interest=(3*u[L[0]]+2*u[L[1]]+u[L[2]])/6;
    const sims=[];
    [["social",2],["structure",2],["lead",2],["num",3]].forEach(([k,rng])=>{ if(p.at[k]!=null) sims.push(1-Math.abs(p.at[k]-c.a[k])/rng); });
    if(p.at.pace!=null) sims.push(p.at.pace===-1?1:1-Math.abs(p.at.pace-c.a.pace)/2);
    const style=sims.length?sims.reduce((a,b)=>a+b)/sims.length:.5;
    const overlap=p.vals.filter(v=>c.v.includes(v));
    const painHit=p.pains.filter(v=>c.v.includes(v));
    const values=Math.min(1,.35+.25*overlap.length+.1*painHit.length);
    const eduGap=Math.max(0,c.a.edu-(p.at.edu??2));
    const ch=p.at.change, changeFit=ch==null?1:ch<=1?(.4+.3*c.t):ch===2?1:(c.a.risk===2?1:.5);
    const practical=((1-eduGap/2)+(p.at.risk==null?1:1-Math.abs(p.at.risk-c.a.risk)/2)+changeFit)/3;
    const total=.5*interest+.25*style+.15*values+.10*practical;
    return {c,total,interest,overlap,painHit,eduGap,u,L};
  }).sort((a,b)=>b.total-a.total);
}

function reasons(m,p){
  const out=[], warn=[];
  const strong=m.L.filter(l=>m.u[l]>=.6).map(l=>LETTERS[l].n);
  if(strong.length) out.push(`Lines up with your ${strong.join(" and ")} interests`);
  m.overlap.forEach(v=>out.push(`Offers ${VALUES[v]}, one of your top priorities`));
  m.painHit.filter(v=>!m.overlap.includes(v)).forEach(v=>out.push(`Addresses what has you stuck: ${PAINS[v].toLowerCase()}`));
  if(p.at.change!=null && p.at.change<=1 && m.c.t===2) out.push("Uses skills you already have, so the move can be quicker");
  const a=m.c.a, at=p.at;
  if(at.social!=null && at.social===a.social) out.push(at.social===2?"Lots of people contact, which energizes you":at.social===0?"Plenty of independent, focused work":"A mix of people time and focus time");
  if(at.lead!=null && at.lead===a.lead) out.push(["Rewards deep expertise","Built around collaboration","Puts you in a leadership seat"][a.lead]);
  if(m.eduGap>0) warn.push("Usually needs more training than you said you're open to");
  if(at.num!=null && a.num-at.num>=2) warn.push("Leans heavily on numbers and technology");
  if(at.risk!=null && Math.abs(at.risk-a.risk)===2) warn.push(a.risk>at.risk?"Carries more income risk than you prefer":"Less independence than you may want");
  if(at.social!=null && Math.abs(at.social-a.social)===2) warn.push(a.social>at.social?"More people time than you said you want":"Less people contact than you said you want");
  return {out:out.slice(0,3),warn:warn.slice(0,2)};
}

function render(){
  if(state.step===-1) return renderIntro();
  if(state.step>=Q.length) return renderResults();
  renderQ();
}

function renderIntro(){
  app.innerHTML=`
  <div class="card">
    <span class="eyebrow">Career coaching · Visioniary LLC</span>
    <h1>Career Fit Compass</h1>
    <p class="intro-lede">Feeling stuck after years in your career is common, and it usually means something about the fit has changed. These 17 questions look at where you are now, what you enjoy, what you're good at, how you like to work, and what matters most. You'll get your interest code and the career moves that fit you best, ready to talk through with your coach.</p>
    <div class="dims">
      ${SECTIONS.map((s,i)=>`<div class="dim"><b>${s}</b><span>${["What has you stuck","What pulls you in","What people rely on you for","People, pace, and structure","Pay, flexibility, and training"][i]}</span></div>`).join("")}
    </div>
    <div class="codes" aria-label="The six interest types">${Object.entries(LETTERS).map(([k,v])=>`<span class="code"><b>${k}</b> ${v.n}</span>`).join("")}</div>
    <form id="startf" class="fields" novalidate>
      <label class="field" for="nm">Your name
        <input type="text" id="nm" autocomplete="name" value="${esc(state.name)}" placeholder="e.g. Jordan Lee" required>
      </label>
      <label class="field" for="em_in">Your email
        <input type="email" id="em_in" autocomplete="email" value="${esc(state.email)}" placeholder="you@example.com" required>
      </label>
      <p class="err" id="err" aria-live="polite"></p>
      <p class="fine">Your results will be sent to your coach at Visioniary so we can prepare for your first conversation.</p>
    </form>
    <div class="row"><button class="btn" id="go" type="submit" form="startf">Start the quiz</button><span class="muted" style="font-size:.9rem">About 6 minutes</span></div>
    <p class="fine">Matches are based on the Holland (RIASEC) interest model plus your work style and priorities. Treat them as a starting point for conversation, not a final verdict.</p>
  </div>`;
  document.getElementById("startf").onsubmit=e=>{
    e.preventDefault();
    const nm=document.getElementById("nm").value.trim(), em=document.getElementById("em_in").value.trim(), err=document.getElementById("err");
    if(!nm){err.textContent="Enter your name to continue.";document.getElementById("nm").focus();return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){err.textContent="Enter a valid email address, like you@example.com.";document.getElementById("em_in").focus();return;}
    state.name=nm;state.email=em;state.sent=false;state.step=0;render();window.scrollTo({top:0});
  };
}

function progressHTML(){
  const cur=Q[state.step].s;
  return `<div class="progress" aria-label="Progress">${SECTIONS.map((s,i)=>{
    const qs=Q.map((q,j)=>j).filter(j=>Q[j].s===i);
    const done=qs.filter(j=>j<state.step).length;
    return `<div class="seg ${i===cur?"on":""}"><div class="bar"><i style="width:${done/qs.length*100}%"></i></div><span>${s}</span></div>`;
  }).join("")}</div>`;
}

function renderQ(){
  const i=state.step, q=Q[i], multi=!!q.multi;
  let sel=state.ans[i]; if(multi && !Array.isArray(sel)) sel=[];
  app.innerHTML=`
  ${progressHTML()}
  <div class="card">
    <div class="qhead">
      <span class="qnum">Question ${i+1} of ${Q.length} · ${SECTIONS[q.s]}</span>
      <h2>${q.t}</h2>
      ${multi?`<p class="muted" style="font-size:.9rem">Choose ${q.multi}.</p>`:""}
    </div>
    <div class="opts" role="group" aria-label="Answer choices">
      ${q.o.map((o,k)=>{const on=multi?sel.includes(k):sel===k;return `<button class="opt ${multi?"multi":""}" data-k="${k}" aria-pressed="${on}"><span class="dot"></span><span>${o[0]}</span></button>`}).join("")}
    </div>
    <div class="row between">
      <button class="btn ghost" id="back">Back</button>
      <button class="btn" id="next" ${(multi?sel.length===q.multi:sel!=null)?"":"disabled"}>${i===Q.length-1?"See my matches":"Next"}</button>
    </div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(multi){
      let a=Array.isArray(state.ans[i])?[...state.ans[i]]:[];
      if(a.includes(k)) a=a.filter(x=>x!==k); else { if(a.length>=q.multi) a.shift(); a.push(k); }
      state.ans[i]=a; renderQ();
    } else {
      state.ans[i]=k;
      app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
      document.getElementById("next").disabled=false;
      setTimeout(()=>{ if(state.step===i){state.step++;render();window.scrollTo({top:0});} },260);
    }
  });
  document.getElementById("back").onclick=()=>{state.step--;render();};
  document.getElementById("next").onclick=()=>{state.step++;render();window.scrollTo({top:0});};
}

function renderResults(){
  const p=profile(), ranked=score(p), top=ranked.slice(0,5), rest=ranked.slice(5,10);
  const order=Object.keys(p.r).sort((a,b)=>p.r[b]-p.r[a]);
  const code=order.slice(0,3);
  const max=Math.max(1,...Object.values(p.r));
  const pct=m=>Math.min(98,Math.round(m.total*100));
  const who=state.name?`${esc(state.name)}'s`:"Your";
  const traits=["social","structure","lead","pace","num","edu","risk"].filter(k=>p.at[k]!=null).map(k=>{
    const lbl={social:"People",structure:"Day-to-day",lead:"Team role",pace:"Pace",num:"Numbers & tech",edu:"Training",risk:"Risk"}[k];
    return `<div class="trait"><small>${lbl}</small><b>${TRAIT_TXT[k][p.at[k]]}</b></div>`;
  });
  const valTxt=p.vals.map(v=>VALUES[v]);

  app.innerHTML=`
  <div class="sendnote" id="sendnote" aria-live="polite">Sending your results to your coach…</div>
  <div class="card hero-res">
    <span class="eyebrow">${who} results</span>
    <div class="hcode">${code.map(l=>`<span class="l" title="${LETTERS[l].n}">${l}</span>`).join("")}</div>
    <h1 style="font-size:clamp(1.7rem,5vw,2.4rem)">${code.map(l=>LETTERS[l].n).join(" · ")}</h1>
    <p class="intro-lede">Your interest code leads with <b>${LETTERS[code[0]].n}</b>: ${LETTERS[code[0]].s.toLowerCase()}. ${valTxt.length?`You said your top priorities are ${valTxt.join(" and ")}.`:""} ${p.at.change!=null?`You're open to ${CHANGE[p.at.change].toLowerCase()}.`:""}</p>
  </div>

  <div class="card">
    <h3>Interest profile</h3>
    <div class="bars">${order.map((l,i)=>`<div class="brow ${i<3?"top":""}"><div class="nm">${LETTERS[l].n}<small>${LETTERS[l].s}</small></div><div class="track"><i style="width:${p.r[l]/max*100}%"></i></div><div class="pct">${p.r[l]}</div></div>`).join("")}</div>
    <h3>Work style</h3>
    <div class="traits">${traits.join("")}</div>
  </div>

  <div class="wrap" style="gap:12px">
    <h2>Top career matches</h2>
    ${top.map((m,i)=>{const r=reasons(m,p);return `
    <div class="match ${i===0?"best":""}">
      <div class="mtop"><div><span class="mcode">${i===0?"BEST FIT · ":""}${m.c.c}</span><h3>${m.c.n}</h3></div><span class="score">${pct(m)}%</span></div>
      <p class="muted">${m.c.d}</p>
      <div class="tags">${m.c.titles.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <ul class="why">${r.out.map(x=>`<li>${x}</li>`).join("")}${r.warn.map(x=>`<li class="warn">${x}</li>`).join("")}</ul>
      <div class="step"><b>First step</b>${m.c.step}</div>
    </div>`}).join("")}
  </div>

  <div class="card">
    <h3>Also worth exploring</h3>
    <div class="more">${rest.map(m=>`<div><b style="font-weight:600">${m.c.n}</b><span>${pct(m)}%</span></div>`).join("")}</div>
  </div>

  <div class="card">
    <h3>Send your results to your coach</h3>
    <p class="muted" style="font-size:.92rem">Email your results with one click, or copy the summary and send it to the address below before your session. We'll use it to plan your first coaching conversation.</p>
    <div class="row"><span class="email" id="em">visioniaryllc@gmail.com</span><button class="btn ghost" id="copyem">Copy email</button></div>
    <textarea id="sum" readonly>${esc(summary(p,code,top))}</textarea>
    <div class="row"><a class="btn" id="mail" href="#">Email my results</a><button class="btn ghost" id="copy">Copy summary</button><button class="btn ghost" id="redo">Retake quiz</button><span class="toast" id="toast" aria-live="polite"></span></div>
    <p class="fine">These results come from your answers and the Holland (RIASEC) interest model. They're a starting point for a coaching conversation, not a test of ability.</p>
  </div>`;
  document.getElementById("copy").onclick=async()=>{
    const ta=document.getElementById("sum"), t=document.getElementById("toast");
    try{await navigator.clipboard.writeText(ta.value);t.textContent="Copied";}
    catch(e){ta.focus();ta.select();t.textContent="Text selected. Press Ctrl+C or Cmd+C to copy.";}
  };
  document.getElementById("mail").href="mailto:visioniaryllc@gmail.com?subject="+encodeURIComponent("Career Fit Compass results"+(state.name?" — "+state.name:""))+"&body="+encodeURIComponent(document.getElementById("sum").value);
  document.getElementById("copyem").onclick=async()=>{
    const t=document.getElementById("toast");
    try{await navigator.clipboard.writeText("visioniaryllc@gmail.com");t.textContent="Email address copied";}
    catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("em"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);t.textContent="Address selected. Press Ctrl+C or Cmd+C to copy.";}
  };
  sendResults(p,code,top);
  document.getElementById("redo").onclick=()=>{state={step:-1,name:state.name,email:state.email,ans:{}};render();window.scrollTo({top:0});};
}

async function sendResults(p,code,top){
  const note=document.getElementById("sendnote");
  if(state.sent){note.textContent="Your results have been sent to your coach.";note.classList.add("ok");return;}
  try{
    const res=await fetch(FORMSPREE,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        name:state.name, email:state.email,
        _subject:`Career Fit Compass results — ${state.name}`,
        interest_code:code.join(""),
        top_matches:top.map((m,i)=>`${i+1}. ${m.c.n} (${Math.min(98,Math.round(m.total*100))}%)`).join("\n"),
        stuck_because:p.pains.map(v=>PAINS[v]).join("; "),
        open_to:p.at.change!=null?CHANGE[p.at.change]:"",
        priorities:p.vals.map(v=>VALUES[v]).join("; "),
        full_summary:document.getElementById("sum").value
      })});
    if(!res.ok) throw new Error(res.status);
    state.sent=true;
    note.textContent="Your results have been sent to your coach. Expect a reply at "+state.email+".";
    note.classList.add("ok");
  }catch(e){
    note.textContent="We couldn't send your results automatically. Use the Email my results button at the bottom of this page instead.";
  }
}

function summary(p,code,top){
  const L=[];
  L.push(`CAREER FIT COMPASS RESULTS${state.name?" — "+state.name:""}`);
  if(state.email) L.push(`Client email: ${state.email}`);
  L.push("Send to: visioniaryllc@gmail.com");
  L.push(`Interest code: ${code.join("")} (${code.map(l=>LETTERS[l].n).join(", ")})`);
  L.push(`Interest scores: ${Object.keys(p.r).map(l=>l+" "+p.r[l]).join(" · ")}`);
  if(p.pains.length) L.push(`Feeling stuck because: ${p.pains.map(v=>PAINS[v]).join("; ")}`);
  if(p.at.change!=null) L.push(`Open to: ${CHANGE[p.at.change].toLowerCase()}`);
  if(p.vals.length) L.push(`Top priorities: ${p.vals.map(v=>VALUES[v]).join("; ")}`);
  ["social","structure","lead","pace","num","edu","risk"].forEach(k=>{ if(p.at[k]!=null) L.push(`- ${TRAIT_TXT[k][p.at[k]]}`); });
  L.push("","Top matches:");
  top.forEach((m,i)=>L.push(`${i+1}. ${m.c.n} — ${Math.min(98,Math.round(m.total*100))}%`));
  L.push("","Answers:");
  Q.forEach((q,i)=>{const a=state.ans[i]; if(a==null) return; L.push(`Q${i+1}. ${q.t} → ${(Array.isArray(a)?a:[a]).map(k=>q.o[k][0].replace(/[“”]/g,'"')).join("; ")}`);});
  return L.join("\n");
}

render();
</script>
